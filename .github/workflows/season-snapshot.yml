name: Season snapshot

on:
  # Runs automatically twice a year, after each semester's season wraps up.
  # May 20 and Dec 20, 12:00 UTC. Adjust the dates to your calendar if needed.
  schedule:
    - cron: "0 12 20 5 *"
    - cron: "0 12 20 12 *"
  # Can also be run any time by hand: repo -> Actions -> Season snapshot -> Run workflow.
  workflow_dispatch:
    inputs:
      season_label:
        description: 'Season name (e.g. "Fall 2026"). Leave blank to auto-name from the date.'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull standings from website
        id: snap
        env:
          SEASON_LABEL: ${{ github.event.inputs.season_label }}
        run: node scripts/snapshot.js

      - name: Open pull request for review
        if: steps.snap.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.snap.outputs.label }}
          SEASON_ID: ${{ steps.snap.outputs.id }}
        run: |
          BRANCH="snapshot/${SEASON_ID}"
          git config user.name "cjl-season-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add rankings.json
          git commit -m "Season snapshot: ${LABEL}"
          git push -f origin "$BRANCH"
          gh pr create \
            --title "Season snapshot: ${LABEL}" \
            --body "Automatic snapshot of the current website standings as **${LABEL}**.

          Please check the numbers against the final tournament results before merging.
          Merging publishes this season to the public rankings page within about a minute.

          If anything is wrong, you can either close this PR and re-run the workflow later, or merge it and fix the numbers in the admin page." \
            --base main \
            --head "$BRANCH" \
            || echo "PR already exists for this branch - it has been updated with the latest data."
